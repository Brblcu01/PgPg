server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: be4fe

  datasource:
    url: jdbc:sqlserver://${DB_HOST:sql-mitur-test-itn.database.windows.net}:${DB_PORT:1433};databaseName=${DB_NAME:sqldb-mitur-kpi-test-itn};encrypt=true;trustServerCertificate=false
    username: ${DB_USER:mitur}
    password: ${DB_PASSWORD:Pr0cGr!12%)}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 5
      keepalive-time: 30000
      max-lifetime: 1800000
      idle-timeout: 600000
      connection-timeout: 30000
      validation-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:1b3ba1c7-9d5b-42ff-a08f-6da40fd10b2d}/v2.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v1/api-docs

logging:
  level:
    it.be4fe: DEBUG
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

otel:
  service:
    name: be4fe
  exporter:
    otlp:
      endpoint: ${OPENTELEMETRY_URL:http://localhost:4318}
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  logs:
    exporter: otlp

SSO: http://localhost:8081
PORTAL: portal
LOCALPORTAL: local
sharepoint:
  base-url: https://graph.microsoft.com/v1.0

AUDIT: http://localhost:8083