server:
  port: 8080

spring:
  application:
    name: be4fe

  datasource:
    url: jdbc:mysql://localhost:3306/portale_proconsul?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Rome
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      keepalive-time: 30000
      max-lifetime: 1800000
      idle-timeout: 600000
      connection-timeout: 30000
      validation-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/1b3ba1c7-9d5b-42ff-a08f-6da40fd10b2d/v2.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v1/api-docs

logging:
  level:
    it.be4fe: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: OFF

SSO: http://localhost:8081
PORTAL: portal
LOCALPORTAL: local

sharepoint:
  base-url: https://graph.microsoft.com/v1.0

AUDIT: http://localhost:8083