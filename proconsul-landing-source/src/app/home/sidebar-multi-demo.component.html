<div class="border border-surface-200 dark:border-surface-700 rounded-lg overflow-hidden">
  <p-sidebar-layout class="min-h-192! relative!">

    @if (isMobile() && (open() || secondaryOpen())) {
      <p-sidebar-backdrop class="absolute!"></p-sidebar-backdrop>
    }

    <p-sidebar
      id="iconbar"
      side="left"
      [collapsible]="isMobile() ? 'offcanvas' : 'icon'"
      [overlay]="true"
      [openOnHover]="!isMobile()"
      width="12rem"
      [(open)]="open"
    >
      <p-sidebar-spacer></p-sidebar-spacer>

      <p-sidebar-aside>
        <p-sidebar-panel>

          <p-sidebar-header>
            <p-sidebar-menu>
              <p-sidebar-menu-item>
                <button pSidebarMenuButton class="p-1!">
                  <div class="flex size-6 shrink-0 items-center justify-center rounded-md bg-emerald-600 text-white text-xs font-bold leading-none">
                    PG
                  </div>
                  <span class="font-semibold text-sm">Proconsul Group</span>
                </button>
              </p-sidebar-menu-item>
            </p-sidebar-menu>
          </p-sidebar-header>

          <p-sidebar-content>
            <p-sidebar-group>
              <p-sidebar-group-content>
                <p-sidebar-menu>

                  <p-sidebar-menu-item>
                    <button pSidebarMenuButton [isActive]="true">
                      <svg data-p-icon="home"></svg>
                      <span>Home</span>
                    </button>
                  </p-sidebar-menu-item>

                  <p-sidebar-menu-item>
                    <button pSidebarMenuButton>
                      <svg data-p-icon="database"></svg>
                      <span>Personale</span>
                    </button>
                  </p-sidebar-menu-item>>

                  <p-sidebar-menu-item>
                    <button pSidebarMenuButton>
                      <svg data-p-icon="server"></svg>
                      <span>Prenota il tuo posto</span>
                    </button>
                  </p-sidebar-menu-item>

                </p-sidebar-menu>
              </p-sidebar-group-content>
            </p-sidebar-group>
          </p-sidebar-content>

          <p-sidebar-footer>
            <p-sidebar-menu>
              <p-sidebar-menu-item>
                <button pSidebarMenuButton>
                  <svg data-p-icon="cog"></svg>
                  <span>Settings</span>
                </button>
              </p-sidebar-menu-item>
            </p-sidebar-menu>
          </p-sidebar-footer>

        </p-sidebar-panel>
      </p-sidebar-aside>
    </p-sidebar>

    <p-sidebar
      id="secondary"
      side="left"
      width="14rem"
      [collapsible]="isMobile() ? 'offcanvas' : 'none'"
      [overlay]="isMobile()"
      [(open)]="secondaryOpen"
    >
      <p-sidebar-spacer></p-sidebar-spacer>

      <p-sidebar-aside>
        <p-sidebar-panel>

          <p-sidebar-header>
            <div class="px-1">
              <span class="font-semibold text-sm">Settings</span>
            </div>
          </p-sidebar-header>

          <p-sidebar-content>

            <p-sidebar-group>
              <p-sidebar-group-label>Configuration</p-sidebar-group-label>

        </p-sidebar-panel>
      </p-sidebar-aside>
    </p-sidebar>

    <p-sidebar-main>
      <header class="flex h-12 items-center gap-2 border-b border-surface-200 dark:border-surface-700 px-4">
        <span class="text-sm font-medium">Table Editor</span>
        <span class="text-xs text-muted-color">/ users</span>
      </header>

      <div class="flex-1 p-4 flex flex-col gap-4">
        <div class="rounded-lg bg-surface-100 dark:bg-surface-800 h-48"></div>
        <div class="rounded-lg bg-surface-100 dark:bg-surface-800 flex-1"></div>
      </div>
    </p-sidebar-main>

  </p-sidebar-layout>
</div>
